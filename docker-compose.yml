name: alertradar

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: alertradar
      POSTGRES_PASSWORD: alertradar
      POSTGRES_DB: alertradar
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alertradar -d alertradar"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://alertradar:alertradar@db:5432/alertradar
      REDIS_URL: redis://redis:6379/0
    command:
      - uvicorn
      - app.main:app
      - --host=0.0.0.0
      - --port=8000
      # The spatial index is per-process; each worker holds its own copy and
      # refreshes independently. Scale on CPU count.
      - --workers=2
      - --no-access-log
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      worker:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://alertradar:alertradar@db:5432/alertradar
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.worker"]
    volumes:
      # Gazetteer GeoJSON is input data, not code. Mounting it keeps a 130 MB
      # boundary file out of the image and lets you re-load without rebuilding.
      - ./data:/srv/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Single instance: the batching window is stateful and the advisory-lock
    # upsert is designed for low writer concurrency, not horizontal scale.
    deploy:
      replicas: 1
    restart: unless-stopped

volumes:
  pgdata:
